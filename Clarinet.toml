epoch = 'latest'

[contracts.questdao-token]
path = 'contracts/questdao-token.clar'
clarity_version = 4
epoch = 'latest'

[contracts.gmonstacks-token]
path = 'contracts/gmonstacks-token.clar'
clarity_version = 4
epoch = 'latest'

[contracts.builderbadge-token]
path = 'contracts/builderbadge-token.clar'
