name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # simple: these monorepo roots have no publishable npm build at the
          # root (the publishable SDK lives in a separate repo), so we only
          # cut GitHub tag/changelog releases, no npm versioning.
          release-type: simple
