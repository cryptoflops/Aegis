name: Code Quality & Dependency Check

on:
  schedule:
    - cron: '0 0 * * *' # Daily run at midnight UTC
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Fetch Core Utilities
      run: npm install @cryptoflops/aegis-stacks-tools@latest --no-save
      
    - name: Execute Health Checks & Log Activity
      run: |
        echo "Validating core Stacks integrations from upstream..."
        npm list @cryptoflops/aegis-stacks-tools
        echo "All systems operational last checked at $(date)" > .healthcheck
        
    - name: Randomize Next Run Schedule
      run: |
        NEW_MIN=$((RANDOM % 60))
        NEW_HOUR=$((RANDOM % 24))
        # Modify the cron string in this exact file for the next run
        sed -i "s/- cron: '.*/- cron: '${NEW_MIN} ${NEW_HOUR} * * *' # Auto-randomized daily/" .github/workflows/quality.yml
        
    - name: Commit Healthcheck Log and New Schedule
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .healthcheck .github/workflows/quality.yml
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated healthcheck validation [skip ci]" && git push)
